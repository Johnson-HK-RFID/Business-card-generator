<?xml version="1.0" encoding="UTF-8"?>
<!--
  Editable vector service label.
  - All wording and the phone number remain live <text> elements.
  - Replace either logo by changing the href on the two <image> elements.
  - Replace the QR group with another vector QR if its destination changes.
  Recommended editor: Adobe Illustrator or Inkscape.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1448" height="1086" viewBox="0 0 1448 1086">
  <title>Editable EmbuilDed service label</title>
  <desc>Vector service label with editable text, replaceable logos and vector QR code.</desc>
  <defs>
    <style><![CDATA[
      .ink { fill:#101820; }
      .gold { fill:#ffc400; }
      .outline { fill:none; stroke:#101820; stroke-width:9; }
      .field { fill:#fff; stroke:#101820; stroke-width:7; }
      .ui { font-family:Arial,Helvetica,sans-serif; fill:#101820; }
      .label { font-size:40px; font-weight:700; }
      .phone { font-size:132px; font-weight:700; letter-spacing:2px; }
      .powered { font-size:38px; font-weight:400; letter-spacing:8px; }
      .site { font-size:44px; font-weight:700; }
    ]]></style>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#101820" flood-opacity=".10"/>
    </filter>
  </defs>

  <g id="background">
    <rect width="1448" height="1086" fill="#fff"/>
    <rect x="20" y="55" width="1408" height="990" rx="58" class="outline"/>
  </g>

  <!-- Replaceable vector logo: change href to another SVG file. -->
  <g id="brand-logo" aria-label="Replaceable EmbuilDed logo">
    <image x="78" y="88" width="895" height="251"
           href="assets/embuilded-logo.svg" xlink:href="assets/embuilded-logo.svg"
           preserveAspectRatio="xMinYMin meet"/>
  </g>

  <g id="powered-lockup">
    <text id="powered-by-text" class="ui powered" x="174" y="376">POWERED BY</text>
    <!-- Replaceable vector partner logo: change href to another SVG file. -->
    <image id="partner-logo" x="472" y="320" width="414" height="82"
           href="assets/traci-logo-on-light.svg" xlink:href="assets/traci-logo-on-light.svg"
           preserveAspectRatio="xMinYMin meet"/>
  </g>

  <!-- Replaceable, scannable vector QR. Change href when its destination changes. -->
  <image id="qr-code" x="1045" y="92" width="318" height="318"
         href="assets/service-label-qr.svg" xlink:href="assets/service-label-qr.svg"/>
  <text id="website" class="ui site" x="1027" y="440">embuilded.com</text>

  <g id="contact-band">
    <rect x="25" y="454" width="1398" height="143" class="gold"/>
    <g id="phone-icon" class="ink" transform="translate(82 473) scale(1.12)">
      <path d="M19 0C8 2 0 12 0 25c0 48 46 94 94 94 13 0 23-8 25-19l3-17c1-5-2-10-7-12L91 59c-5-2-10-1-13 4L67 77C49 68 38 57 29 39l14-11c5-3 6-8 4-13L35 3c-2-4-7-6-11-5L19 0Z"/>
    </g>
    <rect x="227" y="477" width="5" height="98" class="ink"/>
    <text id="phone-number" class="ui phone" x="273" y="566">(852) 3426-9511</text>
  </g>

  <g id="form-labels" class="ui label">
    <text id="label-deployed" x="61" y="645">DEPLOYED</text>
    <text id="label-warranty" x="769" y="645">WARRANTY EXPIRY</text>
    <text id="label-product" x="61" y="799">PRODUCT ID</text>
    <text id="label-password" x="769" y="799">PASSWORD</text>
    <text id="label-engineer" x="61" y="944">ENGINEER</text>
  </g>

  <g id="form-fields" filter="url(#soft-shadow)">
    <rect id="field-deployed" class="field" x="61" y="659" width="645" height="89" rx="12"/>
    <rect id="field-warranty" class="field" x="740" y="659" width="647" height="89" rx="12"/>
    <rect id="field-product" class="field" x="61" y="812" width="645" height="86" rx="12"/>
    <rect id="field-password" class="field" x="740" y="812" width="647" height="86" rx="12"/>
    <rect id="field-engineer" class="field" x="61" y="958" width="1326" height="72" rx="12"/>
  </g>
</svg>
